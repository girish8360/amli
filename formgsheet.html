<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Management Survey</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: maroon;
color:#fff;
        }

        fieldset {
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }

        legend h2 {
            margin: 0;
            padding: 0 10px;
        }

        .question-label {
            font-weight: bold;
        }

        .form-control {
            max-width: 400px;
        }

        .survey-section {
            margin-top: 15px;
        }

        @media (max-width: 575px) {
            .form-control {
                max-width: 100%;
            }

            fieldset {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
<div class="container-fluid px-2 px-sm-3 px-md-4 px-lg-5 py-3">
<form class="form-inline" action="https://sheetdb.io/api/v1/emf2ys13fr3un" method="POST">

   <!-- QUESTIONNAIRE INTEREST -->
         <fieldset style="border:2px solid orange;">
        <legend><h2 class="text-center">PERSONAL INFORMATION</h2></legend>

        <!-- FULL NAME -->
        <div class="form-group row mb-3">
            <label class="col-sm-6 col-form-label question-label">
                FULL NAME :
            </label>
            <div class="col-sm-6">
                <input type="text"
                       class="form-control"
                       id="name"
                       name="data[full_name]"
                       placeholder="Enter FULL NAME"
                       maxlength="100"
                       autocomplete="name"
                       required>
            </div>
        </div>

        <!-- DATE OF BIRTH -->
        <div class="form-group row mb-3">
            <label class="col-sm-6 col-form-label question-label">
                DATE OF BIRTH :
            </label>
            <div class="col-sm-6">
                <input type="date"
                       class="form-control"
                       id="dob"
                       name="data[dob]"
                       style="width:200px;"
                       required>
            </div>
        </div>

         
        <h2 class="text-center mt-4">CONTACT DETAILS</h2>

        <!-- MOBILE -->
        <div class="form-group row mb-3">
            <label class="col-sm-6 col-form-label question-label">
                CONTACT No.
            </label>
            <div class="col-sm-6">
                <input type="tel"
                       id="mob"
                       name="data[mobile]"
                       class="form-control"
                       maxlength="15"
                       placeholder="Enter mobile number"
                       inputmode="numeric"
                       pattern="[0-9+\-\s]{10,15}"
                       autocomplete="tel"
                       required>
            </div>
        </div>

        <!-- EMAIL -->
        <div class="form-group row mb-3">
            <label class="col-sm-6 col-form-label question-label">
                Email ID
            </label>
            <div class="col-sm-6">
                <input type="email"
                       id="email"
                       name="data[email]"
                       class="form-control"
                       maxlength="150"
                       placeholder="Enter email"
                       autocomplete="email">
            </div>
        </div>

        <!-- CITY -->
        <div class="form-group row mb-3">
            <label class="col-sm-6 col-form-label">
                CITY as per Permanent Address ID:
            </label>
            <div class="col-sm-6">
                <input type="text"
                       id="city"
                       name="data[city]"
                       class="form-control"
                       maxlength="60"
                       placeholder="City"
                       autocomplete="address-level2">
            </div>
        </div>

        <!-- STATE -->
        <div class="form-group row mb-3">
            <label class="col-sm-6 col-form-label">
                STATE as per Permanent Address ID:
            </label>
            <div class="col-sm-6">
                <input type="text"
                       id="state"
                       name="data[state]"
                       class="form-control"
                       maxlength="60"
                       placeholder="State"
                       autocomplete="address-level1">
            </div>
        </div>

                 <!-- SUBMIT -->
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary btn-lg px-5">
                SUBMIT HEALTH SURVEY
            </button>

            <button type="reset" class="btn btn-secondary btn-lg px-4 ms-2">
                RESET
            </button>
        </div>

    </fieldset>

</form>

</div>

</body>
</html>
